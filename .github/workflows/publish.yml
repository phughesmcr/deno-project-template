name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true

      - run: deno ci
      - run: deno task ci
      - run: deno publish --dry-run
      - run: deno publish
